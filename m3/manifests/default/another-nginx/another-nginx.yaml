# kubernetes/nginx/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: another-nginx
  labels:
    version: "v2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: another-nginx
  template:
    metadata:
      labels:
        app: another-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
